# Nachos config: Anthropic (direct API)
# Docs: docs/guides/provider-switching.md

[nachos]
name = "my-assistant"
version = "1.0"

[llm]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
max_tokens = 4096
temperature = 0.7

# Optional: fallback to a cheaper model on rate limit
# fallback_order = ["anthropic:claude-haiku-4-5-20251001"]

# Optional: multiple API keys for rate-limit rotation
# [[llm.profiles]]
# name = "primary"
# provider = "anthropic"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [[llm.profiles]]
# name = "subscription"
# provider = "anthropic"
# api_key_env = "ANTHROPIC_SETUP_TOKEN"
#
# profile_order = ["primary", "subscription"]

[security]
mode = "standard"

# .env:
# ANTHROPIC_API_KEY="sk-ant-api03-..."
